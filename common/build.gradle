architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("src/main/resources/createdeco.accesswidener")
}

repositories {
    // mavens for Create Fabric and dependencies
    maven { url = "https://api.modrinth.com/maven" } // LazyDFU
    maven { url = "https://maven.terraformersmc.com/releases/" } // Mod Menu
    maven { url = "https://mvn.devos.one/snapshots/" } // Create Fabric, Porting Lib, Forge Tags, Milk Lib, Registrate Fabric
    maven { url = "https://mvn.devos.one/releases/" } // Porting Lib
    maven { url = "https://cursemaven.com" } // Forge Config API Port
    maven { url = "https://maven.cafeteria.dev/releases" } // Fake Player API
    maven { url = "https://maven.jamieswhiteshirt.com/libs-release" } // Reach Entity Attributes
    maven { // Fabric ASM for Porting Lib
        url = "https://jitpack.io/"
        content { includeGroupAndSubgroups("com.github") }
    }
    maven { url = "https://squiddev.cc/maven/" }

}

dependencies {
    // only for @Environment + mixin deps; keep it
    modImplementation("net.fabricmc:fabric-loader:${fabric_loader_version}")

    // Create Fabric for shared API compile
    modCompileOnly("maven.modrinth:create-fabric:${create_fabric_version}")

    modCompileOnly("net.fabricmc.fabric-api:fabric-api:${fabric_api_version}")

    // Registrate types referenced in common sources
    modCompileOnly("com.tterrag.registrate_fabric:Registrate:${registrate_fabric_version}")

    // Ponder types referenced in common sources
    modCompileOnly("net.createmod.ponder:Ponder-Fabric-${minecraft_version}:${ponder_fabric_version}")

    compileOnly("com.google.code.findbugs:jsr305:3.0.2")

}



processResources {
    exclude("resourcepacks/")
}

sourceSets.main {
    resources {
        srcDir("src/generated/resources")
        exclude("src/generated/resources/.cache")
    }
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
